name: Test và phát hành

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    # Chỉ build và phát hành khi đẩy tag dạng v1.2.3
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Mặc định KHÔNG ký số. Muốn ký:
      #  - Xoá dòng CSC_IDENTITY_AUTO_DISCOVERY bên dưới.
      #  - macOS: thêm secrets CSC_LINK (file .p12 mã hoá base64), CSC_KEY_PASSWORD,
      #    APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID (để notarize).
      #  - Windows: thêm secrets WIN_CSC_LINK và WIN_CSC_KEY_PASSWORD.
      #  Rồi khai báo chúng trong env như: CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:${{ matrix.target }} -- --publish always
